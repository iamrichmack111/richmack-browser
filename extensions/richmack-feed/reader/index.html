<!doctype html>
<html><head><meta charset="utf-8"><title>Richmack Feed Reader</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div class="brand"><img src="../icons/icon48.png"><div><strong>RICHMACK FEED READER</strong><span id="source">Local clean feed preview</span></div></div><div class="counts"><b id="showing">0</b><span>showing</span><b id="total">0</b><span>unique</span></div></header>
<section class="filters">
  <input id="q" type="search" placeholder="Filter title, company, location, salary…">
  <label><input id="easy" type="checkbox"> Easy Apply</label>
  <label><input id="remote" type="checkbox"> Remote</label>
  <label><input id="salary" type="checkbox"> Salary shown</label>
  <button id="reset">Reset</button>
</section>
<section class="actions"><button id="generate">Generate RSS from shown items</button><button id="copy" disabled>Copy RSS URL</button><button id="raw" disabled>Open raw RSS</button></section>
<div id="status" role="status"></div>
<section id="cards" class="cards"></section>
</main><script src="app.js"></script></body></html>
