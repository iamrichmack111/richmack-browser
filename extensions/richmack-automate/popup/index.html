<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css"><main>
<header><img src="../icons/icon48.png"><div><b>AUTOMATE</b><small>record · replay · bulk sequence</small></div></header>
<section class="record"><div class="row"><button id="record">● Record</button><button id="stop" disabled>■ Stop</button></div><div id="recStatus" class="muted">Not recording</div></section>
<input id="workflowName" placeholder="Workflow name"><button id="save" disabled>Save recorded workflow</button>
<div class="section-title">Saved workflows</div><div id="workflows"></div>
<hr>
<div class="section-title">Bulk sequence</div>
<input id="q" placeholder="Follow, Like, Easy Apply…">
<div class="row"><button id="find">Find matching controls</button><label class="check"><input id="exact" type="checkbox" checked> Exact</label></div>
<div id="bulkSummary" class="muted">Find controls first.</div>
<div id="results"></div>
<div class="bulk-options">
<label>Max per run <input id="limit" type="number" min="1" max="25" value="10"></label>
<label>Delay ms <input id="delay" type="number" min="1000" max="10000" step="500" value="2500"></label>
</div>
<div class="row"><button id="runBulk" disabled>▶ Run sequence</button><button id="stopBulk" disabled>■ Stop</button></div>
<div id="bulkStatus" class="muted"></div>
</main><script src="app.js"></script>
