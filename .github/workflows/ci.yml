name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extensions:
    name: Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate manifests and files
        run: python tests/validate_extensions.py
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            node --check "$f"
          done < <(find extensions -type f -name '*.js' -print0)

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/requirements.txt
            services/requirements-dev.txt
      - run: python -m pip install -r services/requirements-dev.txt
      - run: python -m compileall -q services/app
      - run: pytest -q tests/backend

  distribution:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n launcher/richmack-browser
          bash -n tests/smoke.sh
          bash -n scripts/package-release.sh
      - run: bash tests/smoke.sh
      - run: scripts/package-release.sh
      - name: Verify artifacts
        run: |
          unzip -t "dist/richmack-browser-v$(cat VERSION).zip"
          unzip -t "dist/richmack-extension-suite-v$(cat VERSION).zip"
          (cd dist && shasum -a 256 -c "richmack-browser-v$(cat ../VERSION).sha256")
          (cd dist && shasum -a 256 -c "richmack-extension-suite-v$(cat ../VERSION).sha256")

  container:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t richmack-browser-services:ci ./services
      - name: Run hardened container
        run: |
          docker run -d \
            --name richmack-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --tmpfs /downloads:rw,nosuid,nodev,size=256m,uid=10001,gid=10001 \
            -p 127.0.0.1:8765:8765 \
            richmack-browser-services:ci
      - name: Health check
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs richmack-ci
          exit 1
      - name: Logs
        if: always()
        run: docker logs richmack-ci || true
      - name: Cleanup
        if: always()
        run: docker rm -f richmack-ci || true
