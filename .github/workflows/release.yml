name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: Test before release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/requirements-dev.txt
      - run: python tests/validate_extensions.py
      - run: pytest -q tests/backend
      - run: bash tests/smoke.sh
      - name: JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find extensions -type f -name '*.js' -print0)

  container:
    name: Publish GHCR
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./services
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/richmack-browser-services:v${{ needs.validate.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/richmack-browser-services:latest

  artifacts:
    name: Publish GitHub Release
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build distributions
        run: scripts/package-release.sh "${{ needs.validate.outputs.version }}"
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/richmack-browser-v${{ needs.validate.outputs.version }}.zip \
            dist/richmack-browser-v${{ needs.validate.outputs.version }}.sha256 \
            dist/richmack-extension-suite-v${{ needs.validate.outputs.version }}.zip \
            dist/richmack-extension-suite-v${{ needs.validate.outputs.version }}.sha256 \
            --title "Richmack Browser OS $GITHUB_REF_NAME" \
            --generate-notes
