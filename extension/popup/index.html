<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Richmack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" />
    <div><strong>RICHMACK</strong><small id="pageHost">browser tools</small></div>
    <button id="mode" class="mode">MODE OFF</button>
  </header>

  <section class="quick" aria-label="Quick actions">
    <button id="extract" title="Scan page"><span>⌁</span><b>Extract</b></button>
    <button id="images" title="Download page images"><span>▧</span><b>Images</b></button>
    <button id="media" title="Download current media URL"><span>⇩</span><b>Media</b></button>
    <button id="pick" title="Pick a button or link to automate"><span>◎</span><b>Pick</b></button>
    <button id="bookmark" title="Smart bookmark"><span>★</span><b>Save</b></button>
    <button id="panel" title="Open detailed tools"><span>⋯</span><b>More</b></button>
  </section>

  <section class="resource" id="resource" hidden>
    <div><small>CURRENT RESOURCE</small><strong id="resourceType"></strong><span id="resourceName"></span></div>
    <button id="resourceDownload">Download</button>
  </section>

  <section>
    <div class="sectionHead"><span>WORKSPACE</span><button id="assign">Assign tab</button></div>
    <div id="workspaces" class="workspaces"></div>
  </section>

  <section id="results" hidden>
    <div class="sectionHead"><span>EXTRACT</span><button id="copyLinks">Copy links</button></div>
    <div class="stats">
      <div><strong id="nLinks">0</strong><small>Links</small></div>
      <div><strong id="nImages">0</strong><small>Images</small></div>
      <div><strong id="nEmails">0</strong><small>Emails</small></div>
      <div><strong id="nDocs">0</strong><small>Docs</small></div>
    </div>
    <div class="resultActions">
      <button id="copyEmails">Copy emails</button>
      <button id="saveText">Save text</button>
    </div>
  </section>

  <section id="picked" hidden>
    <div class="sectionHead"><span>AUTOMATION TARGET</span><button id="clearPicked">×</button></div>
    <code id="pickedSelector"></code>
    <small id="pickedText"></small>
    <button id="runPicked" class="primary">Click saved target</button>
  </section>

  <footer><span id="dot">●</span><span id="status">Ready</span><span class="spacer"></span>v0.3.0</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
