<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Richmack Tools</title><link rel="stylesheet" href="style.css"></head><body>
<header><img src="../icons/icon32.png" alt=""><div><strong>RICHMACK</strong><small>DETAIL TOOLS</small></div><button id="mode">MODE OFF</button></header>
<nav><button data-view="workspace" class="active">Workspace</button><button data-view="extract">Extract</button><button data-view="automate">Automate</button></nav>
<main>
<section id="workspace" class="view active"><h2>WORKSPACES</h2><div id="workspaces" class="cards"></div><div class="row"><button id="assign" class="primary">Assign current tab</button><button id="bookmark">★ Smart bookmark</button></div><details open><summary>SMART BOOKMARKS</summary><input id="filter" placeholder="Filter bookmarks"><div id="bookmarks" class="list"></div></details></section>
<section id="extract" class="view"><h2>EXTRACT CENTER</h2><p class="muted">Links · images · emails · documents · media · text</p><button id="scan" class="primary">Scan current page</button><div id="stats" class="stats"></div><div class="row"><button id="copyLinks">Copy clean links</button><button id="copyEmails">Copy emails</button></div><div class="row"><button id="images">Download images</button><button id="pdfs">Download PDFs</button><button id="text">Save text</button></div><pre id="output">Nothing scanned yet.</pre></section>
<section id="automate" class="view"><h2>AUTOMATION</h2><p class="muted">Pick a page element visually, then replay the click. Site access stays user-triggered.</p><button id="pick" class="primary">Pick element on page</button><div id="picked" class="picked" hidden><code id="selector"></code><small id="pickedText"></small><button id="run" class="primary">Click saved target</button></div></section>
</main><footer><span id="dot">●</span> Richmack tools <span class="spacer"></span>v0.4.0</footer><script type="module" src="app.js"></script></body></html>
